[project]
name = "niyam-rulebook"
version = "0.1.0"
description = "Maharashtra welfare scheme eligibility rules as tested code, with a source for every rule"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["niyam_rulebook"]
