        clause: "1"
        quote: "त्यानुसार १ अपत्य किंवा २ अपत्य असलेल्या विधवा लाभार्थ्यांना देखील अर्थसहाय्याची रक्कम दरमहा रु.१५००/- इतकी राहील."
