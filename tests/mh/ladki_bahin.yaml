scheme: mh.ladki_bahin
# Base person used by every case: an eligible woman under the 2024-06-28 GR.
# Each case changes only what it tests. Every case cites its clause.
base: &base
  age: 35
  gender: female
  state: MH
  marital_status: married
  annual_family_income: 180000
  has_bank_account: true

cases:
  - name: typical eligible woman gets Rs 1,500
    date: 2024-06-30
    person: {<<: *base}
    expect: {eligible: true, monthly_inr: 1500}
    source: GR 202406281814018230 p.2 para 2 and 4

  - name: scheme not in force before launch
    date: 2024-06-27
    person: {<<: *base}
    expect: {eligible: false, in_force: false}
    source: GR 202406281814018230 dated 2024-06-28

  - name: age 21 is eligible (lower boundary)
    date: 2024-06-30
    person: {<<: *base, age: 21}
    expect: {eligible: true}
    source: GR 202406281814018230 p.2 clause 4(3)

  - name: age 20 is not eligible
    date: 2024-06-30
    person: {<<: *base, age: 20}
    expect: {eligible: false}
    source: GR 202406281814018230 p.2 clause 4(3)

  - name: age 60 is eligible (upper boundary)
    date: 2024-06-30
    person: {<<: *base, age: 60}
    expect: {eligible: true}
    source: GR 202406281814018230 p.2 clause 4(3)

  - name: age 61 is not eligible
    date: 2024-06-30
    person: {<<: *base, age: 61}
    expect: {eligible: false}
    source: GR 202406281814018230 p.2 clause 4(3)

  - name: income exactly Rs 2.5 lakh is eligible
    date: 2024-06-30
    person: {<<: *base, annual_family_income: 250000}
    expect: {eligible: true}
    source: GR 202406281814018230 p.2 clause 4(5) "not more than"

  - name: income Rs 2,50,001 is not eligible
    date: 2024-06-30
    person: {<<: *base, annual_family_income: 250001}
    expect: {eligible: false}
    source: GR 202406281814018230 p.2 clause 5(1)

  - name: men are not eligible
    date: 2024-06-30
    person: {<<: *base, gender: male}
    expect: {eligible: false}
    source: GR 202406281814018230 p.2 clause 3

  - name: resident of another state is not eligible
    date: 2024-06-30
    person: {<<: *base, state: other}
    expect: {eligible: false}
    source: GR 202406281814018230 p.2 clause 4(1)

  - name: widow is eligible
    date: 2024-06-30
    person: {<<: *base, marital_status: widowed}
    expect: {eligible: true}
    source: GR 202406281814018230 p.2 clause 4(2)

  - name: unmarried woman is not eligible under the original GR
    date: 2024-06-30
    person: {<<: *base, marital_status: unmarried}
    expect: {eligible: false}
    source: GR 202406281814018230 p.2 clause 4(2)

  - name: no bank account is not eligible
    date: 2024-06-30
    person: {<<: *base, has_bank_account: false}
    expect: {eligible: false}
    source: GR 202406281814018230 p.2 clause 4(4)

  - name: income tax payer in family is not eligible
    date: 2024-06-30
    person: {<<: *base, family_income_tax_payer: true}
    expect: {eligible: false}
    source: GR 202406281814018230 p.2 clause 5(2)

  - name: contract government employee in family is not eligible
    date: 2024-06-30
    person: {<<: *base, family_govt_job: contract}
    expect: {eligible: false}
    source: GR 202406281814018230 p.2 clause 5(3)

  - name: outsourced worker in family is eligible
    date: 2024-06-30
    person: {<<: *base, family_govt_job: outsourced}
    expect: {eligible: true}
    source: GR 202406281814018230 p.2 clause 5(3) proviso

  - name: pensioner in family is not eligible
    date: 2024-06-30
    person: {<<: *base, family_govt_job: pensioner}
    expect: {eligible: false}
    source: GR 202406281814018230 p.2 clause 5(3)

  - name: receives exactly Rs 1,500 from another scheme, eligible but paid nothing extra
    date: 2024-06-30
    person: {<<: *base, other_scheme_monthly_inr: 1500}
    expect: {eligible: true, monthly_inr: 0}
    source: GR 202406281814018230 p.2 clause 5(4) "more than" and para 2

  - name: receives Rs 1,501 from another scheme is not eligible
    date: 2024-06-30
    person: {<<: *base, other_scheme_monthly_inr: 1501}
    expect: {eligible: false}
    source: GR 202406281814018230 p.2 clause 5(4)

  - name: receives Rs 1,000 from another scheme gets the Rs 500 difference
    date: 2024-06-30
    person: {<<: *base, other_scheme_monthly_inr: 1000}
    expect: {eligible: true, monthly_inr: 500}
    source: GR 202406281814018230 p.2 para 2

  - name: MP or MLA in family is not eligible
    date: 2024-06-30
    person: {<<: *base, family_mp_mla: true}
    expect: {eligible: false}
    source: GR 202406281814018230 p.2 clause 5(5)

  - name: government board member in family is not eligible
    date: 2024-06-30
    person: {<<: *base, family_govt_board_office: true}
    expect: {eligible: false}
    source: GR 202406281814018230 p.2 clause 5(6)

  - name: exactly 5 acres of farm land is eligible
    date: 2024-06-30
    person: {<<: *base, family_farm_land_acres: 5}
    expect: {eligible: true}
    source: GR 202406281814018230 p.2 clause 5(7) "more than five acres"

  - name: 5.5 acres of farm land is not eligible
    date: 2024-06-30
    person: {<<: *base, family_farm_land_acres: 5.5}
    expect: {eligible: false}
    source: GR 202406281814018230 p.2 clause 5(7)

  - name: four-wheeler in family is not eligible
    date: 2024-06-30
    person: {<<: *base, family_four_wheeler: true}
    expect: {eligible: false}
    source: GR 202406281814018230 p.2 clause 5(8)

  # ---- GR 202407031335114330 (2024-07-03) ----

  # c1: maximum age 60 -> 65
  - name: age 64 is eligible after the amendment
    date: 2024-07-03
    person: {<<: *base, age: 64}
    expect: {eligible: true}
    source: GR 202407031335114330 p.2 clause 4(3)

  - name: age 65 is eligible after the amendment (upper boundary)
    date: 2024-07-03
    person: {<<: *base, age: 65}
    expect: {eligible: true}
    source: GR 202407031335114330 p.2 clause 4(3)

  - name: age 66 is not eligible after the amendment
    date: 2024-07-03
    person: {<<: *base, age: 66}
    expect: {eligible: false}
    source: GR 202407031335114330 p.2 clause 4(3)

  - name: age 65 was not eligible the day before the amendment
    date: 2024-07-02
    person: {<<: *base, age: 65}
    expect: {eligible: false}
    source: GR 202407031335114330 p.2 clause 4(3), old rule per GR 202406281814018230

  # c2 and c3: unmarried woman, one per family
  - name: unmarried woman is eligible after the amendment
    date: 2024-07-03
    person: {<<: *base, marital_status: unmarried}
    expect: {eligible: true, monthly_inr: 1500}
    source: GR 202407031335114330 p.2 clause 4(2)

  - name: unmarried woman is not eligible if another unmarried woman in the family already receives it
    date: 2024-07-03
    person: {<<: *base, marital_status: unmarried, other_unmarried_beneficiary_in_family: true}
    expect: {eligible: false}
    source: GR 202407031335114330 p.2 clause 4(2)

  - name: married woman is not affected by another unmarried beneficiary in the family
    date: 2024-07-03
    person: {<<: *base, other_unmarried_beneficiary_in_family: true}
    expect: {eligible: true}
    source: GR 202407031335114330 p.2 clause 4(2)

  - name: unmarried woman was not eligible the day before the amendment
    date: 2024-07-02
    person: {<<: *base, marital_status: unmarried}
    expect: {eligible: false}
    source: GR 202407031335114330 p.2 clause 4(2), old rule per GR 202406281814018230

  # c4: contract workers no longer disqualify
  - name: contract employee in family is eligible after the amendment
    date: 2024-07-03
    person: {<<: *base, family_govt_job: contract}
    expect: {eligible: true}
    source: GR 202407031335114330 p.2 clause 5(3)

  - name: regular employee in family is still not eligible after the amendment
    date: 2024-07-03
    person: {<<: *base, family_govt_job: regular}
    expect: {eligible: false}
    source: GR 202407031335114330 p.2 clause 5(3)

  - name: pensioner in family is still not eligible after the amendment
    date: 2024-07-03
    person: {<<: *base, family_govt_job: pensioner}
    expect: {eligible: false}
    source: GR 202407031335114330 p.2 clause 5(3)

  - name: contract employee in family was not eligible the day before the amendment
    date: 2024-07-02
    person: {<<: *base, family_govt_job: contract}
    expect: {eligible: false}
    source: GR 202407031335114330 p.2 clause 5(3), old rule per GR 202406281814018230

  # c5: Rs 1,500 or more from other schemes now disqualifies
  - name: receives Rs 1,499 from another scheme is eligible after the amendment
    date: 2024-07-03
    person: {<<: *base, other_scheme_monthly_inr: 1499}
    expect: {eligible: true, monthly_inr: 1}
    source: GR 202407031335114330 p.2 clause 5(4)

  - name: receives exactly Rs 1,500 from another scheme is not eligible after the amendment
    date: 2024-07-03
    person: {<<: *base, other_scheme_monthly_inr: 1500}
    expect: {eligible: false}
    source: GR 202407031335114330 p.2 clause 5(4) "or more than that"

  - name: receives Rs 1,501 from another scheme is not eligible after the amendment
    date: 2024-07-03
    person: {<<: *base, other_scheme_monthly_inr: 1501}
    expect: {eligible: false}
    source: GR 202407031335114330 p.2 clause 5(4)

  - name: receives exactly Rs 1,500 from another scheme was eligible the day before the amendment
    date: 2024-07-02
    person: {<<: *base, other_scheme_monthly_inr: 1500}
    expect: {eligible: true, monthly_inr: 0}
    source: GR 202407031335114330 p.2 clause 5(4), old rule per GR 202406281814018230

  # c6: farm land limit removed
  - name: exactly 5 acres of farm land is eligible after the amendment
    date: 2024-07-03
    person: {<<: *base, family_farm_land_acres: 5}
    expect: {eligible: true}
    source: GR 202407031335114330 p.2 clause 5(7)

  - name: 5.5 acres of farm land is eligible after the amendment
    date: 2024-07-03
    person: {<<: *base, family_farm_land_acres: 5.5}
    expect: {eligible: true}
    source: GR 202407031335114330 p.2 clause 5(7)

  - name: 20 acres of farm land is eligible after the amendment
    date: 2024-07-03
    person: {<<: *base, family_farm_land_acres: 20}
    expect: {eligible: true}
    source: GR 202407031335114330 p.2 clause 5(7)

  - name: 5.5 acres of farm land was not eligible the day before the amendment
    date: 2024-07-02
    person: {<<: *base, family_farm_land_acres: 5.5}
    expect: {eligible: false}
    source: GR 202407031335114330 p.2 clause 5(7), old rule per GR 202406281814018230
